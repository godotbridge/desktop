name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: GodotBridge-win64.exe
            nuitka_extra: "--windows-console-mode=disable"
          - os: ubuntu-22.04
            artifact: GodotBridge-linux
            nuitka_extra: ""
          - os: macos-13
            artifact: GodotBridge-macos.zip
            nuitka_extra: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pywebview httpx nuitka ordered-set zstandard

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev patchelf

      - name: Copy bundled addon
        run: python -c "import shutil; from pathlib import Path; src=Path('addon')/'godot_mcp_bridge'; dest=Path('bundled_addon'); shutil.rmtree(dest, ignore_errors=True); shutil.copytree(src, dest, ignore=shutil.ignore_patterns('*.uid','.godot','__pycache__'))"

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=GodotBridge \
            --company-name=DigitalFusion \
            --product-name=GodotBridge \
            --include-data-dir=frontend=frontend \
            --include-data-dir=bundled_addon=bundled_addon \
            --output-dir=dist \
            --python-flag=-m \
            ${{ matrix.nuitka_extra }} \
            src/godotbridge_desktop
        shell: bash

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv dist/GodotBridge.exe "dist/${{ matrix.artifact }}"
        shell: bash

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/GodotBridge "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "${{ matrix.artifact }}" GodotBridge

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: GodotBridge Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
