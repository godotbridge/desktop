[project]
name = "godotbridge-desktop"
version = "1.0.0"
description = "GodotBridge Desktop — setup wizard and project manager for GodotBridge MCP server."
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "DigitalFusion", email = "info@digital-fusion.com.tr"},
]
dependencies = [
    "pywebview>=5.0",
    "httpx>=0.27",
]

[project.scripts]
godotbridge-desktop = "godotbridge_desktop.__main__:main"

[project.optional-dependencies]
build = [
    "nuitka>=2.0",
    "ordered-set",
    "zstandard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godotbridge_desktop"]
